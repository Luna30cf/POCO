<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - POCO</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

  <h1>Dashboard POCO 🌱</h1>

  <p id="user-email"></p>

  <h2>Mes pots</h2>

  <button id="add-pot-button" type="button">
    + Ajouter un pot
  </button>

  <p id="bluetooth-status"></p>

  <div id="pots-container">
    <p>Chargement des pots...</p>
  </div>

  <button id="logout-button">
    Se déconnecter
  </button>

  <div id="wifi-modal" class="modal" hidden>

  <div class="modal__content">

    <button
      id="wifi-modal-close"
      class="modal__close"
      type="button"
      aria-label="Fermer"
    >
      ×
    </button>

    <h2>Configuration Wi-Fi</h2>

    <p id="wifi-pot-name"></p>

    <label for="wifi-ssid">
      Nom du réseau Wi-Fi
    </label>

    <input
      id="wifi-ssid"
      type="text"
      placeholder="SSID"
    >

    <label for="wifi-security">
      Sécurité
    </label>

    <select id="wifi-security">
      <option value="password">
        Réseau protégé
      </option>

      <option value="open">
        Réseau ouvert
      </option>
    </select>

    <div id="wifi-password-container">

      <label for="wifi-password">
        Mot de passe
      </label>

      <input
        id="wifi-password"
        type="password"
        placeholder="Mot de passe Wi-Fi"
      >

    </div>

      <button
        id="send-wifi-button"
        type="button"
      >
        Connecter au Wi-Fi
      </button>

      <p id="wifi-status"></p>

    </div>

    </div>

  <script src="/pages/dashboard.js"></script>

</body>
</html>
