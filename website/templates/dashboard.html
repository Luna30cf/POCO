<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#5F9872">

  <title>POCO</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link
    rel="stylesheet"
    href="/css/dashboard.css?v=3"
  >
</head>

<body>

  <header class="app-header">

    <a
      href="/mes-plantes"
      class="app-header__logo"
      aria-label="Retour à mes plantes"
    >
      <img
        src="/images/logo-poco.svg"
        alt="POCO"
      >
    </a>



    <button
      id="logout-button"
      class="profile-button"
      type="button"
      aria-label="Se déconnecter"
    > Se déconnecter
      
     
    </button>
    
  </header>


  <!-- Gardé pour le JS, mais pas affiché -->
  <p
    id="user-email"
    hidden
  ></p>


  <p
    id="bluetooth-status"
    class="bluetooth-status"
  ></p>


  <main
    id="pots-container"
    class="dashboard"
  >
    <p>Chargement du pot...</p>
  </main>


  <!-- POPUP WI-FI -->

  <div
    id="wifi-modal"
    class="modal"
    hidden
  >

    <div class="modal__content">

      <button
        id="wifi-modal-close"
        class="modal__close"
        type="button"
        aria-label="Fermer"
      >
        ×
      </button>


      <h2>
        Configuration Wi-Fi
      </h2>


      <p id="wifi-pot-name"></p>


      <label for="wifi-ssid">
        Nom du réseau Wi-Fi
      </label>

      <input
        id="wifi-ssid"
        type="text"
        placeholder="SSID"
      >


      <label for="wifi-security">
        Sécurité
      </label>

      <select id="wifi-security">

        <option value="password">
          Réseau protégé
        </option>

        <option value="open">
          Réseau ouvert
        </option>

      </select>


      <div id="wifi-password-container">

        <label for="wifi-password">
          Mot de passe
        </label>

        <input
          id="wifi-password"
          type="password"
          placeholder="Mot de passe Wi-Fi"
        >

      </div>


      <button
        id="send-wifi-button"
        type="button"
      >
        Connecter au Wi-Fi
      </button>


      <p id="wifi-status"></p>

    </div>

  </div>


  <script src="/pages/dashboard.js"></script>

    <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/service-worker.js")
          .then(() => {
            console.log("Service Worker POCO enregistré");
          })
          .catch((error) => {
            console.error(
              "Erreur Service Worker POCO :",
              error
            );
          });
      });
    }
  </script>

</body>

</html>
