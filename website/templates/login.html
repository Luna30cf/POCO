<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Connexion - POCO</title>

  <!-- CSS de la page de connexion -->
  <link
    rel="stylesheet"
    href="/css/login.css"
  >

  <!-- Bibliothèque Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>
</head>


<body>

  <main class="login-container">

    <!-- =========================
         EN-TÊTE
    ========================== -->

    <header class="login-header">

      <h1>POCO</h1>

      <p>
        Votre assistant pour prendre soin de vos plantes
      </p>

    </header>


    <!-- =========================
         CONNEXION
    ========================== -->

    <section class="login-card">

      <h2>Connexion</h2>

      <p class="login-description">
        Connectez-vous pour accéder à vos pots.
      </p>


      <form id="login-form">

        <!-- Email -->
        <div class="form-group">

          <label for="email">
            Adresse e-mail
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="exemple@email.fr"
            autocomplete="email"
            required
          >

        </div>


        <!-- Mot de passe -->
        <div class="form-group">

          <label for="password">
            Mot de passe
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Votre mot de passe"
            autocomplete="current-password"
            required
          >

        </div>


        <!-- Connexion -->
        <button
          type="submit"
          class="login-button"
        >
          Se connecter
        </button>


        <!-- Erreurs Supabase -->
        <p
          id="error-message"
          role="alert"
          aria-live="polite"
        ></p>

      </form>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="login-footer">
      POCO — Pot connecté intelligent
    </footer>

  </main>


  <!-- =========================
       JAVASCRIPT POCO
  ========================== -->

  <script src="/pages/login.js"></script>

</body>

</html>
