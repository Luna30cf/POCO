<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Créer un compte - POCO</title>

  <link
    rel="stylesheet"
    href="/css/login.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>
</head>

<body>

  <main class="login-container">

    <header class="login-header">
      <h1>POCO</h1>
      <p>Votre assistant pour prendre soin de vos plantes</p>
    </header>

    <section class="login-card">

      <h2>Créer un compte</h2>

      <p class="login-description">
        Créez votre compte pour commencer à utiliser POCO.
      </p>

      <form id="register-form">

        <div class="form-group">
          <label for="email">
            Adresse e-mail
          </label>

          <input
            type="email"
            id="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">
            Mot de passe
          </label>

          <input
            type="password"
            id="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <div class="form-group">
          <label for="password-confirm">
            Confirmer le mot de passe
          </label>

          <input
            type="password"
            id="password-confirm"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <button
          type="submit"
          class="login-button"
        >
          Créer mon compte
        </button>

        <p
          id="error-message"
          role="alert"
          aria-live="polite"
        ></p>

        <p id="success-message"></p>

      </form>

      <p class="login-footer">
        Déjà un compte ?
        <a href="/login">Se connecter</a>
      </p>

    </section>

  </main>

  <script src="/pages/register.js"></script>

</body>

</html>
