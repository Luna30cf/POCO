<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mes plantes - POCO</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link
    rel="stylesheet"
    href="/css/home.css"
  >
</head>

<body>

  <header class="plants-header">

    <div class="plants-header__logo">
      <img
        src="/images/logo-poco.svg"
        alt="POCO"
      >
    </div>

    <h1>Mes plantes</h1>

    <button
      id="logout-button"
      type="button"
      aria-label="Se déconnecter"
    >
      <img
        src="/images/user.png"
        alt=""
      >
    </button>

  </header>


  <main class="plants-page">

    <p id="bluetooth-status"></p>

    <section
      id="plants-container"
      class="plants-grid"
    >
      <p>Chargement de vos plantes...</p>
    </section>

  </main>


  <!-- POPUP CONFIGURATION WI-FI -->

  <div
    id="wifi-modal"
    class="modal"
    hidden
  >

    <div class="modal__content">

      <button
        id="wifi-modal-close"
        class="modal__close"
        type="button"
        aria-label="Fermer"
      >
        ×
      </button>

      <h2>Configuration Wi-Fi</h2>

      <p id="wifi-pot-name"></p>

      <label for="wifi-ssid">
        Nom du réseau Wi-Fi
      </label>

      <input
        id="wifi-ssid"
        type="text"
        placeholder="SSID"
      >


      <label for="wifi-security">
        Sécurité
      </label>

      <select id="wifi-security">

        <option value="password">
          Réseau protégé
        </option>

        <option value="open">
          Réseau ouvert
        </option>

      </select>


      <div id="wifi-password-container">

        <label for="wifi-password">
          Mot de passe
        </label>

        <input
          id="wifi-password"
          type="password"
          placeholder="Mot de passe Wi-Fi"
        >

      </div>


      <button
        id="send-wifi-button"
        type="button"
      >
        Connecter au Wi-Fi
      </button>

      <p id="wifi-status"></p>

    </div>

  </div>


  <script src="/pages/mes-plantes.js"></script>

</body>

</html>
